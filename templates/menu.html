<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>BYTE | Menu</title>
</head>
<body class="striped-bg">
    <nav class="navbar">
        <div class="logo">BYTE</div>
        <div>
            <span style="color:white; font-weight:bold; margin-right: 15px;">Welcome, {{ session['customer_name'] }}</span>
            <a href="/profile" class="btn" style="background-color: #1e88e5; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-size: 0.9rem;">My Profile</a>
        </div>
    </nav>
    <div class="layout">
        <div class="menu-container">
            {% for food in foods %}
            <div class="card">
                <img src="{{ food.image_url }}" alt="{{ food.item_name }}" class="food-img">
                <div class="card-content">
                    <h3>{{ food.item_name }}</h3>
                    <p class="food-desc">{{ food.description }}</p>
                    <span class="price">₹{{ food.price }}</span>
                    <button class="btn add-btn" onclick="addToCart({{ food.item_id }}, '{{ food.item_name }}', {{ food.price }})">Add to Cart</button>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="cart-container">
            <h2 style="color: #0d47a1; border-bottom: 2px solid #bbdefb; padding-bottom: 10px;">Your Cart</h2>
            <ul id="cart-items" style="list-style: none; padding: 0; margin-top: 15px;"></ul>
            
            <h3 class="total-text" style="text-align: right; margin-top: 20px; color: #1565c0;">Total: ₹<span id="cart-total">0</span></h3>
            
            <form action="/review" method="POST" id="checkout-form">
                <input type="hidden" name="cart_data" id="cart_data">
                <input type="hidden" name="total_amount" id="total_amount">
                <button type="submit" class="btn checkout-btn" onclick="prepareCheckout(event)" style="width: 100%; margin-top: 10px; background-color: #43a047;">Review Order</button>
            </form>
        </div>
    </div>
    
    <script>
        let cart = [];
        
        // Adds an item or increases its quantity
        function addToCart(id, name, price) {
            let item = cart.find(i => i.id === id);
            if (item) item.quantity++;
            else cart.push({ id, name, price, quantity: 1 });
            updateUI();
        }
        
        // --- NEW: Decreases quantity 1 by 1 ---
        function decreaseQuantity(id) {
            let itemIndex = cart.findIndex(i => i.id === id);
            if (itemIndex !== -1) {
                if (cart[itemIndex].quantity > 1) {
                    cart[itemIndex].quantity--; // Reduce by 1
                } else {
                    cart.splice(itemIndex, 1); // Remove completely if it hits 0
                }
                updateUI();
            }
        }
        
        function updateUI() {
            let list = document.getElementById('cart-items');
            let total = 0;
            list.innerHTML = '';
            
            cart.forEach(i => {
                total += i.price * i.quantity;
                // Upgraded UI for the cart items with +/- buttons
                list.innerHTML += `
                <li class="cart-li" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 10px;">
                    <div style="flex: 1;">
                        <div style="font-weight: bold; color: #333;">${i.name}</div>
                        <div style="font-size: 0.8rem; color: #888;">₹${i.price} each</div>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 10px; background: #f4f9fd; padding: 5px; border-radius: 8px;">
                        <button onclick="decreaseQuantity(${i.id})" style="background: #ef5350; color: white; border: none; border-radius: 4px; width: 25px; height: 25px; cursor: pointer; font-weight: bold;">-</button>
                        <span style="font-weight: bold; min-width: 15px; text-align: center;">${i.quantity}</span>
                        <button onclick="addToCart(${i.id}, '${i.name}', ${i.price})" style="background: #43a047; color: white; border: none; border-radius: 4px; width: 25px; height: 25px; cursor: pointer; font-weight: bold;">+</button>
                    </div>
                    
                    <div style="font-weight: bold; width: 70px; text-align: right; color: #1e88e5;">
                        ₹${i.price * i.quantity}
                    </div>
                </li>`;
            });
            
            document.getElementById('cart-total').innerText = total;
        }
        
        function prepareCheckout(e) {
            if (cart.length === 0) { 
                alert("Your cart is empty! Please add some delicious food first."); 
                e.preventDefault(); 
                return; 
            }
            document.getElementById('cart_data').value = JSON.stringify(cart);
            document.getElementById('total_amount').value = document.getElementById('cart-total').innerText;
        }
    </script>
</body>
</html>
